# frontend 容器（nginx）配置（详细设计 6.1）。
# 关键点：/api 反代到 api:8000，且**必须关闭缓冲**，否则 Phase 1 起的 SSE 流式响应会被缓存。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端为 SPA：找不到的路径回落到 index.html（Backlog 页面不建路由，由 /api/v1/meta 驱动隐藏）
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 把入口 request_id 透传给后端，便于前后端日志串联（1.5.1）
        proxy_set_header X-Request-Id $request_id;
        # SSE：关闭缓冲 + 拉长读超时（6.1）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection "";
    }

    # 健康探针在根路径（3.1），单独透传
    location = /healthz {
        proxy_pass http://api:8000/healthz;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass http://api:8000/readyz;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
    }
}
