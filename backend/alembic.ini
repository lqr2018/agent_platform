[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# The URL is NOT configured here: alembic/env.py injects it from app.core.config.Settings
# (single config entry point, design doc 1.4). Keep this file ASCII-only: configparser
# reads it with the system locale encoding.
# sqlalchemy.url =
# SQLite needs batch mode to add/alter constraints (design doc 2.14)
render_as_batch = true

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
