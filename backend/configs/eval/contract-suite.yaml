# Phase 7 的「机制契约」用例集（详细设计 4.9.4 第一条）。
#
# 用途：CI 里用 `FakeLLMProvider`（`APP_ENV=test`）跑，不依赖网络与真实模型，
# 断言的是**平台机制**而不是模型能力：工具真的被调用、工具失败被回填给模型、KB 预检索不破坏对话。
# 对应的端到端测试：`backend/tests/integration/test_eval_contract_suite.py`。
#
# 前置条件（测试自己建，绝不依赖 seed 数据）：
# - 一个启用的 Agent（模型指向 fake provider），并**绑定 `calculator` 工具**；
# - 该 Agent 绑定一个已 ready 的知识库 —— `task-2-kb-prefetch` 要的是"绑了 KB 也照常走工具循环"
#   （4.4.2 的固定预检索在首轮 LLM 之前跑）；"引用真的被注入"由集成测试查 `retriever` span 的
#   `output.chunk_ids` 断言（4.9.3 的断言类型里没有"span 存在"这一项，硬塞进去只会自欺）；
# - `kb_search`（未绑 KB 时的按需检索，4.4.2 的第二种模式）归**迭代 E**：先留位 `task-6-kb-search`
#   并置 `enabled: false`（4.9.2：不启用就不进分母）；
# - 不由本文件声明 `agent:`，必须显式 `--agent <id|name>`（契约用例要跑在"测试 Agent"上）。
#
# 说明：`FakeLLMProvider` 的确定性行为（4.1.3）——
#   含「计算」→ 调 `calculator`（参数从文本里抽算式）；含「检索」→ 调 `kb_search`；
#   第二轮（已有工具结果）→ 回答 `结果：{工具输出}`；无工具可调 → `FAKE_RESPONSE: {用户输入}`。
name: contract-suite
description: 平台机制契约用例（FakeLLMProvider，无网络依赖）
cases:
  - id: task-1-calculator
    input: 计算 12 * (3 + 3)
    expected:
      - type: tool_sequence
        value: [calculator]
        mode: exact
        description: 工具被真正调用，且只调了一次
      - type: contains
        value: "12 * (3 + 3) = 72"
        description: 工具结果被回填进第二轮的回答
      - type: max_latency
        value_ms: 30000

  - id: task-2-kb-prefetch
    input: 计算 5 * 5
    expected:
      - type: tool_sequence
        value: [calculator]
        mode: exact
        description: 绑 KB 的固定预检索（4.4.2）在首轮 LLM 之前跑完，且不打断工具循环
      - type: contains
        value: "5 * 5 = 25"
        description: 预检索之后仍走完"工具结果回填 → 第二轮回答"
      - type: max_latency
        value_ms: 30000

  - id: task-3-equals-normalize
    input: 计算 8 / 2
    expected:
      - type: equals
        value: "结果：8 / 2 = 4"
        normalize: [strip]
        description: equals + normalize（模型第二轮回答整句回填）
      - type: tool_sequence
        value: [calculator]
        mode: in_order
        description: 子序列模式（允许中间多调工具）

  - id: task-4-tool-error-backfill
    input: 计算 1 / 0
    expected:
      - type: tool_sequence
        value: [calculator]
        mode: exact
      - type: contains
        value: "Division by zero"
        description: 工具失败不中断 Run，错误以 JSON 回填给模型（4.2.3）
      - type: regex
        value: "TOOL_EXECUTION_FAILED"
        description: 回填内容里带错误码（模型可自行修正）

  - id: task-5-plain-answer
    input: 你好
    expected:
      - type: regex
        value: "^结果：|^FAKE_RESPONSE: "
        description: 无工具路径（纯对话）也能产出结果
      - type: max_latency
        value_ms: 30000

  # `kb_search`（未绑 KB 时的按需检索）属迭代 E（4.4.2 的第二种模式，见附录 F v1.16）：先留位，
  # 等工具落地后把 `enabled` 改回 true（本用例不计入分母，4.9.2）。
  - id: task-6-kb-search
    enabled: false
    input: 检索平台的核心能力
    expected:
      - type: tool_sequence
        value: [kb_search]
        mode: contains
        description: 未绑 KB 时模型按需检索（迭代 E 的工具，MVP 不存在）
      - type: max_latency
        value_ms: 30000
