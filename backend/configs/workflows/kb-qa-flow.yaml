# kb-qa-flow —— 知识库问答的最小图（对应《详细设计》8.4 Demo 3 的知识库链路）
#
# 图：start → retrieve(retriever) → router(condition) → answer(agent) → end
#                              └─ 未命中 → fallback(agent) → end
#
# 说明（Phase 5 现状）：
#
# - `retriever` 节点已接真实检索（4.5.2 复用 `kb_service.retrieve`）：命中切片（带 4.6.3 的
#   `source`）写进 `chunks`；未命中 / 空索引写**空数组**，`router` 因此走"未命中"分支
#   （8.4 的"未命中必须说不编造"由 `fallback` 分支保证）；
# - `kb_id` 必须是**已存在的知识库 id**（`GET /api/v1/knowledge-bases` 返回的 `id`）：查不到会得到
#   `KB_NOT_FOUND`，节点 `on_error=continue` 把错误文本写进 `chunks` 后继续后续节点；
# - `kb_id` / `agent_id` 是占位：写库时由 `seed_demo` 解析成真实 id（8.1）。
version: 1
workflow:
  name: kb-qa-flow
  description: "知识库问答：检索 → 命中判断 → 带引用回答 / 明确拒答"
  state_schema:
    question: { type: string }
    chunks: { type: array }
    answer: { type: string }
  definition:
    nodes:
      - id: start
        type: start
        name: 开始
        next: retrieve
      - id: retrieve
        type: retriever
        name: 检索
        kb_id: product-docs
        query_template: "{{state.question}}"
        output_key: chunks
        on_error: continue
        next: router
      - id: router
        type: condition
        name: 是否命中
        branches:
          - when: len(state.chunks) > 0
            next: answer
        default_next: fallback
      - id: answer
        type: agent
        name: 回答
        agent_id: kb-assistant
        input_template: "问题：{{state.question}}\n资料：{{nodes.retrieve.output}}"
        output_key: answer
        next: end
      - id: fallback
        type: agent
        name: 拒答
        agent_id: kb-assistant
        input_template: "问题：{{state.question}}\n资料为空：请明确回答“知识库中没有检索到相关内容”，不要编造。"
        output_key: answer
        next: end
      - id: end
        type: end
        name: 结束
    config:
      max_steps: 20
      recursion_limit: 30
      timeout_seconds: 300
