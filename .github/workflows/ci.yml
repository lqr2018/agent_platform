name: ci

# 详细设计 6.4：backend / frontend / docker 三个 job；push 与 pull_request 触发。
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff + mypy + pytest + alembic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # 说明：所有 `run:` 都经 `.github/scripts/tee_annotate.sh` 包装——输出落盘到
      # $RUNNER_TEMP，失败时把尾部写进**注解**（注解在 /commit/<sha>/checks 页面
      # 无需登录即可阅读，而完整日志需要登录）。
      - name: Install dependencies
        run: bash ../.github/scripts/tee_annotate.sh install-deps bash -euo pipefail -c 'python -m pip install --upgrade pip && pip install -e ".[dev]"'

      - name: 记录依赖版本（排查"本地过、CI 挂"的版本漂移）
        run: python -m pip freeze

      - name: ruff check
        run: bash ../.github/scripts/tee_annotate.sh ruff-check ruff check .

      - name: ruff format --check
        run: bash ../.github/scripts/tee_annotate.sh ruff-format ruff format --check .

      - name: mypy (app/core 与 app/runtime 严格通过，9.3)
        run: bash ../.github/scripts/tee_annotate.sh mypy mypy app

      - name: pytest（含迁移往返与文档/代码一致性测试）
        run: bash ../.github/scripts/tee_annotate.sh pytest pytest -q --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: 断言为干净检出（无 data/ 目录）—— 下面两步必须能自愈
        run: |
          rm -rf data
          test ! -e data

      - name: alembic 往返（7.1 DoD 第 3 条；干净检出无 data/ 也必须成功）
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/ci.db
        run: bash ../.github/scripts/tee_annotate.sh alembic-roundtrip bash -euo pipefail -c 'alembic upgrade head && alembic downgrade base && alembic upgrade head'

      - name: 就绪探针（6.3：连库 + 可写 + 迁移在 head，等价 /readyz）
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/ci.db
        run: bash ../.github/scripts/tee_annotate.sh readyz python -m app.scripts.check_readyz

      - name: alembic check（迁移与 ORM 模型无差异，2.14）
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/ci.db
        run: bash ../.github/scripts/tee_annotate.sh alembic-check alembic check

      - name: OpenAPI 导出与提交版本一致（3.5）
        run: bash ../.github/scripts/tee_annotate.sh openapi-consistency bash -euo pipefail -c 'python -m app.scripts.export_openapi && git diff --exit-code ../docs/openapi.json'

  frontend:
    name: frontend (eslint + tsc + vitest + gen:api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: bash ../.github/scripts/tee_annotate.sh npm-ci npm ci --no-audit --no-fund

      - name: eslint
        run: bash ../.github/scripts/tee_annotate.sh eslint npm run lint

      - name: prettier --check
        run: bash ../.github/scripts/tee_annotate.sh prettier npm run format:check

      - name: tsc --noEmit
        run: bash ../.github/scripts/tee_annotate.sh tsc npm run typecheck

      - name: vitest
        run: bash ../.github/scripts/tee_annotate.sh vitest npm run test

      - name: gen:api 与提交版本一致（3.5 / 9.3 门禁）
        run: bash ../.github/scripts/tee_annotate.sh gen-api bash -euo pipefail -c 'npm run gen:api && git diff --exit-code src/types/api.d.ts'

  docker:
    name: docker compose build（不推送，6.4）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build api + frontend images
        run: bash .github/scripts/tee_annotate.sh docker-build docker compose -f docker/docker-compose.yml build
